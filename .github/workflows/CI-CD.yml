name: CI/CD

env:
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}

on:
  push:
    branches: ['main']

jobs:
  build:
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check secrets presence
        env:
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: ./scripts/check-secrets.sh

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        env:
          NODE_ENV: ${{ secrets.NODE_ENV }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          NODE_ENV: ${{ secrets.NODE_ENV }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @lemnity/database exec prisma generate

      - name: Lint
        run: pnpm --filter client --filter server lint

      # - name: Format
      #   run: pnpm --filter client --filter server format

      # Собираем embed.js заранее, чтобы он попал в public/dist
      - name: Build embed script
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: pnpm --filter @lemnity/embed-script run build

      # Собираем production-билд клиента как статику (dist)
      - name: Build client dist
        env:
          NODE_ENV: ${{ secrets.NODE_ENV }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: pnpm --filter client run build

      # Публикуем dist как артефакт, чтобы CD мог забрать и отправить на сервер через scp
      - name: Upload client dist artifact
        uses: actions/upload-artifact@v5
        with:
          name: client-artifact
          path: projects/client/dist

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build collector image
        env:
          COLLECTOR_PORT: ${{ secrets.COLLECTOR_PORT }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_QUEUE: ${{ secrets.RABBITMQ_QUEUE }}
          CLICKHOUSE_URL: ${{ secrets.CLICKHOUSE_URL }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          CLICKHOUSE_DB: ${{ secrets.CLICKHOUSE_DB }}
          CLICKHOUSE_EVENTS_TABLE: ${{ secrets.CLICKHOUSE_EVENTS_TABLE }}
          COLLECT_ENDPOINT: ${{ secrets.COLLECT_ENDPOINT }}
          COLLECTOR_API_TOKEN: ${{ secrets.COLLECTOR_API_TOKEN }}
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/collector:${{ env.IMAGE_TAG }} \
            -f projects/collector/Dockerfile .

      - name: Build rabbitmq-gateway image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/rabbitmq-gateway:${{ env.IMAGE_TAG }} \
            -f projects/rabbitmq-gateway/Dockerfile .

      - name: Build server image
        env:
          NODE_ENV: ${{ secrets.NODE_ENV }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: ${{ secrets.PORT }}
          S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET_UPLOADS: ${{ secrets.S3_BUCKET_UPLOADS }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          COLLECTOR_API_URL: ${{ secrets.COLLECTOR_API_URL }}
          COLLECTOR_API_TOKEN: ${{ secrets.COLLECTOR_API_TOKEN }}
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/server:${{ env.IMAGE_TAG }} \
            -f projects/server/Dockerfile .

      - name: Push server image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/server:${{ env.IMAGE_TAG }}

      - name: Push collector image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/collector:${{ env.IMAGE_TAG }}

      - name: Push rabbitmq-gateway image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/rabbitmq-gateway:${{ env.IMAGE_TAG }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: prod

    steps:
      # Забираем dist клиента, собранный в CI и загруженный как артефакт client-dist
      - name: Download client dist artifact
        uses: actions/download-artifact@v5
        with:
          name: client-artifact
          path: artifacts

      - name: Показать тег образа, который будет деплоиться
        run: echo "Deploying IMAGE_TAG=${{ env.IMAGE_TAG }}"

      # Заливаем собранный dist на сервер в папку dist рядом с docker-compose.prod.yml
      - name: Upload client dist to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: 'artifacts'
          target: '${{ secrets.PROD_APP_DIR }}/dist'
          # rm:false — НЕ удаляем папку dist (иначе пересоздаётся inode и ломается
          # bind-mount nginx ./dist:/usr/share/nginx/html → 403 до пересоздания контейнера).
          # Файлы перезаписываются на месте, монтирование остаётся валидным.
          rm: false
          strip_components: 1

      - name: Connect and deploy to server
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e

            cd ${{ secrets.PROD_APP_DIR }}

            echo "==> Update repo on server (sync to origin/main)"
            if [ -d .git ]; then
              # Прод — зеркало origin/main. reset --hard вместо git pull, чтобы деплой не падал
              # при расхождении/перезаписи истории (force-push). Локальные правки на проде не ожидаются.
              git fetch origin
              git checkout -f main
              git reset --hard origin/main
            else
              echo "WARNING: .git not found in PROD_APP_DIR, skip git sync"
            fi

            IMAGE_TAG="${{ env.IMAGE_TAG }}"
            REPOSITORY_OWNER="${{ github.repository_owner }}"

            echo "Using IMAGE_TAG=${IMAGE_TAG}"
            echo "Repository owner: ${REPOSITORY_OWNER}"

            echo "==> Login to GHCR"
            docker login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

            echo "==> Run deploy script (pull images, run migrations, up stack)"
            ./deploy.sh "${IMAGE_TAG}" "${REPOSITORY_OWNER}"
