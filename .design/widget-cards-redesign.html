<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог виджетов — редизайн (Editorial Light)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Дизайн-токены платформы (src/index.css · тема Editorial Light) */
  :root{
    --background:#F8F7F5;     /* warm off-white */
    --foreground:#171717;     /* near-black */
    --card:#ffffff;
    --muted-foreground:#707070;
    --brand:#1A52DB;          /* editorial blue */
    --brand-600:#1647c0;
    --brand-soft:#EEF3FF;     /* accent tint */
    --border:#E3E1DD;         /* warm hairline */
    --secondary:#F0EFED;      /* warm gray */
    --radius:6px;
    --ok:#1f7a48; --ok-bg:#e9f3ec;
    --warn:#9a6b00; --warn-bg:#f7efdd;
    --off:#8a8784; --off-bg:#efedea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Manrope',sans-serif;
    background:var(--background);
    color:var(--foreground);
    min-height:100vh;
    padding:40px 48px 72px;
    -webkit-font-smoothing:antialiased;
  }
  .crumbs{font-size:13px;color:var(--muted-foreground);font-weight:500;margin-bottom:16px;display:flex;gap:8px;align-items:center}
  .crumbs b{color:var(--brand);font-weight:600}
  hr{border:none;border-top:1px solid var(--border);margin:14px 0}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
  h1{font-family:'Rubik',sans-serif;font-weight:600;font-size:24px;letter-spacing:-.2px}
  .sub{color:var(--muted-foreground);font-size:13.5px;margin-top:7px;display:flex;align-items:center;gap:8px}
  .sub .info{width:18px;height:18px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:700;display:grid;place-items:center;font-style:italic;font-family:'Rubik'}
  .legend{font-size:12px;color:var(--muted-foreground);white-space:nowrap}
  .legend span{display:inline-flex;align-items:center;gap:6px;margin-left:16px}
  .dot{width:7px;height:7px;border-radius:50%}

  .section{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:26px 0 18px;flex-wrap:wrap}
  .section-title{font-family:'Rubik';font-size:18px;font-weight:500}

  /* сегментированный фильтр по направлениям */
  .filter{display:inline-flex;background:var(--secondary);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px}
  .filter button{
    font-family:'Manrope';font-size:13px;font-weight:600;color:var(--muted-foreground);
    border:none;background:none;cursor:pointer;padding:7px 14px;border-radius:8px;line-height:1;
    transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;
  }
  .filter button:hover{color:var(--foreground)}
  .filter button.active{background:#fff;color:var(--brand);box-shadow:0 1px 2px rgba(23,23,23,.08)}
  .filter button .count{font-size:11px;font-weight:700;padding:1px 6px;border-radius:50px;background:var(--brand-soft);color:var(--brand)}
  .filter button:not(.active) .count{background:#e6e4e0;color:#8a8784}

  .grid{display:grid;grid-template-columns:repeat(3, minmax(320px,1fr));gap:18px}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted-foreground);font-size:14px;padding:40px 0}

  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    display:flex;flex-direction:column;
    min-height:198px;
    transition:box-shadow .2s ease, border-color .2s ease, transform .2s ease;
  }
  .card:hover{box-shadow:0 10px 28px -16px rgba(23,23,23,.22);border-color:#d8d5cf;transform:translateY(-2px)}

  .row1{display:flex;align-items:center;justify-content:space-between;gap:10px}
  /* иконка-тайл: тонированный фон цвета на ~12% + цветная иконка (токен accent / accent-foreground) */
  .icon{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;background:var(--tile);color:var(--accent)}
  .icon svg{width:23px;height:23px}

  .meta{display:flex;align-items:center;gap:8px}
  .badge{font-size:11px;font-weight:600;padding:4px 9px;border-radius:50px;line-height:1;letter-spacing:.2px}
  .badge.new{background:var(--brand-soft);color:var(--brand)}
  .badge.soon{background:var(--secondary);color:#8a8784}

  .switch{width:40px;height:23px;border-radius:50px;background:#dcdad6;position:relative;cursor:pointer;transition:background .2s;flex:0 0 auto}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18);transition:left .2s}
  .switch.on{background:var(--brand)}
  .switch.on::after{left:19px}

  .body{margin-top:15px;flex:1}
  .title{font-family:'Rubik';font-weight:500;font-size:16.5px;letter-spacing:-.1px;line-height:1.2}
  .desc{color:var(--muted-foreground);font-size:12.5px;margin-top:6px;line-height:1.45}

  .status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:50px;line-height:1}
  .status.ok{background:var(--ok-bg);color:var(--ok)}
  .status.warn{background:var(--warn-bg);color:var(--warn)}
  .status.off{background:var(--off-bg);color:var(--off)}

  .actions{display:flex;gap:9px;margin-top:16px}
  .btn{flex:1;height:40px;border:1px solid transparent;border-radius:9px;font-family:'Manrope';font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;transition:.16s}
  .btn svg{width:15px;height:15px}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-600)}
  /* оплата — 2-й слот действий (на месте бывшего «Демо») */
  .btn-pay{background:#fff;color:var(--brand);border-color:#c9d6f4}
  .btn-pay:hover{background:var(--brand-soft)}
  .btn-activate{background:var(--brand);color:#fff}
  .btn-activate:hover{background:var(--brand-600)}

  .card.locked{background:#fbfaf9}
  .card.locked .icon{background:var(--secondary);color:#a8a5a0}
  .card.locked .title{color:#8a8784}
  .card.locked:hover{transform:none;box-shadow:none;border-color:var(--border)}
  .card .lock{margin-top:16px;display:flex;align-items:center;gap:8px;color:var(--muted-foreground);font-size:12.5px;font-weight:500}
  .card .lock svg{width:15px;height:15px}
</style>
</head>
<body>

  <div class="crumbs">Главная <span>›</span> <b>Проект «Lemnity Demo»</b></div>
  <hr>
  <div class="head">
    <div>
      <h1>Каталог виджетов</h1>
      <div class="sub"><span class="info">i</span> Одновременно можно включить до 3 типов виджетов — они показываются на сайте по очереди</div>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:#1f7a48"></i>Активен</span>
      <span><i class="dot" style="background:#c89a2b"></i>Скоро истекает</span>
      <span><i class="dot" style="background:#bdbab6"></i>Не оплачен</span>
    </div>
  </div>
  <hr>

  <div class="section">
    <div class="section-title">Виджеты</div>
    <div class="filter" id="filter"></div>
  </div>
  <div class="grid" id="grid"></div>

<script>
const I = {
  wheel:'<path fill="none" stroke="currentColor" stroke-width="2" d="M12 3a9 9 0 100 18 9 9 0 000-18zM12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/>',
  form:'<rect x="4" y="3" width="16" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8 8h8M8 12h8M8 16h5"/>',
  fab:'<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 5h5v5H5zM14 5h5v5h-5zM5 14h5v5H5z"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 14v5M14 16.5h5"/>',
  announce:'<path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 10v4l11 5V5L4 10z"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M18 9a3.5 3.5 0 010 6"/>',
  timer:'<circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 13V9M9 2h6"/>',
  bell:'<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6zM10 19a2 2 0 004 0"/>',
  video:'<rect x="3" y="6" width="13" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M16 10l5-3v10l-5-3z"/>',
  phone:'<path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L16 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>',
  gift:'<path fill="none" stroke="currentColor" stroke-width="2" d="M4 11h16v9H4zM4 7h16v4H4zM12 7v13"/><path fill="none" stroke="currentColor" stroke-width="2" d="M12 7S10 3 8 4s1 3 4 3zM12 7s2-4 4-3-1 3-4 3z"/>',
};
const add='<svg viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>';
const pencil='<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 20l4-1L19 8l-3-3L5 16l-1 4zM14 7l3 3"/></svg>';
const lock='<svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" d="M8 10V8a4 4 0 018 0v2"/></svg>';

// акценты приглушены под editorial-палитру; тайл = цвет на ~12% (hex + "1f")
// cat — направления: leads / engage / reward (виджет может относиться к нескольким)
const cards=[
  {t:'Колесо фортуны',d:'Лиды, вовлечение, вознаграждение',ic:'wheel',a:'#c77d1a',badge:'new',state:'create',cat:['engage','reward']},
  {t:'Лид-форма',d:'Сбор контактов, заявки, подписки',ic:'form',a:'#1A52DB',badge:'new',state:'active',days:'90 дней',cat:['leads']},
  {t:'Мультикнопка',d:'Мессенджеры и связь в один тап',ic:'fab',a:'#6d3fc0',badge:'new',state:'create',cat:['leads','engage']},
  {t:'Анонс',d:'Акции, новости и спецпредложения',ic:'announce',a:'#0e8a7e',badge:'new',state:'warn',days:'4 дня',cat:['engage']},
  {t:'Таймер событий',d:'Обратный отсчёт до старта акции',ic:'timer',a:'#c0392f',badge:'new',state:'create',cat:['engage']},
  {t:'Уведомления',d:'Всплывающие подсказки и сигналы',ic:'bell',a:'#3f43c4',badge:'new',state:'off',days:'0 дней',cat:['engage']},
  {t:'Видео виджет',d:'Кружок-приветствие с призывом',ic:'video',a:'#b8322c',badge:'new',state:'create',cat:['engage','leads']},
  {t:'Обратный звонок',d:'Заявка на звонок за 30 секунд',ic:'phone',a:'#0a8a52',badge:'new',state:'create',cat:['leads']},
  {t:'Конвейер подарков',d:'Скоро в каталоге Lemnity',ic:'gift',a:'#8a8784',badge:'soon',state:'locked',cat:['reward']},
];

const DIRECTIONS=[
  {id:'all',label:'Все'},
  {id:'leads',label:'Лиды'},
  {id:'engage',label:'Вовлечение'},
  {id:'reward',label:'Вознаграждение'},
];
let activeDir='all';

const filterEl=document.getElementById('filter');
function countFor(id){return id==='all'?cards.length:cards.filter(c=>c.cat?.includes(id)).length}
function renderFilter(){
  filterEl.innerHTML=DIRECTIONS.map(d=>
    `<button data-id="${d.id}" class="${d.id===activeDir?'active':''}">${d.label}<span class="count">${countFor(d.id)}</span></button>`
  ).join('');
  filterEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeDir=b.dataset.id;renderFilter();renderGrid()});
}

function renderGrid(){
const list=activeDir==='all'?cards:cards.filter(c=>c.cat?.includes(activeDir));
document.getElementById('grid').innerHTML=(list.length?list:[]).map(c=>{
  if(c.state==='locked'){
    return `<div class="card locked">
      <div class="row1"><div class="icon">${svg(c.ic)}</div><div class="meta"><span class="badge soon">Скоро</span></div></div>
      <div class="body"><div class="title">${c.t}</div><div class="desc">${c.d}</div></div>
      <div class="lock">${lock} Появится в ближайшем обновлении</div>
    </div>`;
  }
  const sw=(c.state==='active'||c.state==='warn')?'on':'';
  let status='';
  if(c.state==='active') status=`<span class="status ok"><i class="dot" style="background:#1f7a48"></i>${c.days}</span>`;
  if(c.state==='warn')   status=`<span class="status warn"><i class="dot" style="background:#c89a2b"></i>${c.days}</span>`;
  if(c.state==='off')    status=`<span class="status off"><i class="dot" style="background:#bdbab6"></i>${c.days}</span>`;

  let actions;
  if(c.state==='create')    actions=`<button class="btn btn-primary">${add}Создать</button>`;
  else if(c.state==='off')  actions=`<button class="btn btn-activate">Активировать</button>`;
  else if(c.state==='warn') actions=`<button class="btn btn-primary">${pencil}Редактировать</button><button class="btn btn-pay">Продлить</button>`;
  else                      actions=`<button class="btn btn-primary">${pencil}Редактировать</button>`;

  return `<div class="card" style="--accent:${c.a};--tile:${c.a}1f">
    <div class="row1">
      <div class="icon">${svg(c.ic)}</div>
      <div class="meta">${c.badge==='new'?'<span class="badge new">Новинка</span>':''}${status}<div class="switch ${sw}"></div></div>
    </div>
    <div class="body"><div class="title">${c.t}</div><div class="desc">${c.d}</div></div>
    <div class="actions">${actions}</div>
  </div>`;
}).join('') || '<div class="empty">В этом направлении пока нет виджетов</div>';
}

function svg(k){return `<svg viewBox="0 0 24 24">${I[k]}</svg>`}

renderFilter();
renderGrid();
</script>
</body>
</html>
